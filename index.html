
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yasin | Graphic Design Portfolio</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#111;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
}
header{
padding:55px 7% 35px;
border-bottom:1px solid #333;
}
h1{font-size:35px;margin:0 0 12px}
header p{color:#999;font-size:14px}
main{padding:35px 7%}
h2{font-size:20px;margin-bottom:25px}
.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}
.card{
background:#202020;
border-radius:8px;
overflow:hidden;
}
.card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
}
.card p{
padding:12px;
margin:0;
font-size:13px;
color:#ddd;
}
footer{
text-align:center;
padding:35px;
color:#777;
font-size:12px;
}
@media(min-width:700px){
.gallery{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header>
<h1>YASIN.</h1>
<p>GRAPHIC DESIGN PORTFOLIO</p>
</header>

<div class="card">
