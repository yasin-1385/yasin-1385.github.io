
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YASIN — Graphic Design Portfolio</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
background:#f5f5f3;
color:#171717;
font-family:Arial,sans-serif;
}

header{
padding:35px 6%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
}

.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.header-label{font-size:10px;letter-spacing:3px;color:#777}

.intro{padding:75px 6% 55px}
.intro small{letter-spacing:4px;color:#888;font-size:11px}
.intro h1{
font-size:clamp(38px,8vw,85px);
letter-spacing:-4px;
margin-top:18px;
line-height:1;
}
.intro p{margin-top:20px;color:#777;font-size:14px}

.section-title{
padding:0 6% 22px;
display:flex;
justify-content:space-between;
align-items:center;
}
.section-title h2{font-size:14px;letter-spacing:2px}
.section-title span{font-size:11px;color:#888}

.gallery{
padding:0 6% 70px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px 15px;
}

.item{cursor:pointer}
.item img{
width:100%;
aspect-ratio:4/5;
object-fit:contain;
background:#e9e9e7;
display:block;
transition:.3s;
}
.item:hover img{opacity:.85}
.item p{font-size:11px;letter-spacing:1px;margin-top:10px;color:#555}

footer{
border-top:1px solid #ddd;
padding:30px 6%;
font-size:10px;
letter-spacing:2px;
color:#888;
}

.lightbox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
z-index:10;
justify-content:center;
align-items:center;
padding:20px;
}
.lightbox img{max-width:100%;max-height:85vh;object-fit:contain}
.lightbox button{
position:absolute;
top:20px;
right:25px;
background:none;
border:none;
color:white;
font-size:35px;
cursor:pointer;
}

@media(max-width:650px){
.gallery{grid-template-columns:repeat(2,1fr);gap:18px 10px}
.intro{padding-top:55px}
header{padding:25px 6%}
.intro h1{letter-spacing:-2px}
}
</style>
</head>

<body>

<header>
<div class="logo">YASIN.</div>
<div class="header-label">GRAPHIC DESIGNER</div>
</header>

<section class="intro">
<small>PORTFOLIO — 2026</small>
<h1>SELECTED<br>WORKS.</h1>
<p>Visual Design · Social Media · Creative Graphics</p>
</section>

<section class="section-title">
<h2>ALL PROJECTS</h2>
<span id="count">Loading...</span>
</section>

<main class="gallery" id="gallery"></main>

<div class="lightbox" id="lightbox">
<button onclick="closeImage()">×</button>
<img id="largeImage" src="" alt="Portfolio preview">
</div>

<footer>YASIN — GRAPHIC DESIGN PORTFOLIO</footer>

<script>
fetch("images.json")
.then(response => {
if(!response.ok) throw new Error("Gallery not found");
return response.json();
})
.then(images => {
const gallery=document.getElementById("gallery");
document.getElementById("count").textContent=images.length+" WORKS";

images.forEach((filename,index)=>{
const item=document.createElement("div");
item.className="item";

const img=document.createElement("img");
img.src=filename;
img.alt="Design "+(index+1);
img.loading="lazy";

img.onclick=()=>{
document.getElementById("largeImage").src=filename;
document.getElementById("lightbox").style.display="flex";
};

const caption=document.createElement("p");
caption.textContent="PROJECT / "+String(index+1).padStart(2,"0");

item.append(img,caption);
gallery.appendChild(item);
});
})
.catch(error=>{
document.getElementById("count").textContent="Gallery unavailable";
console.error(error);
});

function closeImage(){
document.getElementById("lightbox").style.display="none";
document.getElementById("largeImage").src="";
}
</script>

</body>
</html>
