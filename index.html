
<script>
fetch("images.json")
.then(response => response.json())
.then(images => {
  const gallery = document.getElementById("gallery");
  document.getElementById("count").textContent =
    images.length + " WORKS";

  images.forEach((filename, index) => {
    const item = document.createElement("div");
    item.className = "item";

    const img = document.createElement("img");
    img.src = filename;
    img.alt = "Design " + (index + 1);
    img.loading = "lazy";

    img.onclick = () => {
      document.getElementById("largeImage").src = filename;
      document.getElementById("lightbox").style.display = "flex";
    };

    const caption = document.createElement("p");
    caption.textContent = "PROJECT / " + String(index + 1).padStart(2,"0");

    item.append(img, caption);
    gallery.appendChild(item);
  });
})
.catch(error => console.log("Gallery loading error:", error));

function closeImage(){
  document.getElementById("lightbox").style.display = "none";
  document.getElementById("largeImage").src = "";
}
</script>
