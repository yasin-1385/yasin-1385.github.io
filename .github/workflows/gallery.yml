
name: Update Portfolio Gallery

on:
  push:
    branches:
      - main
    paths:
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.PNG'
      - '*.JPG'
      - '*.JPEG'
      - '.github/workflows/gallery.yml'

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image list
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          extensions = {".png", ".jpg", ".jpeg"}
          images = sorted(
              [p.name for p in Path(".").iterdir()
               if p.is_file() and p.suffix.lower() in extensions],
              key=str.lower
          )

          Path("images.json").write_text(
              json.dumps(images, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Save image list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --cached --quiet || (git commit -m "Update portfolio gallery" && git push)
