
name: Update Image Gallery

on:
  push:
    branches:
      - main
    paths:
      - '*.webp'
      - '*.WEBP'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          python3 - <<'PY'
          import os
          import json

          images = []

          for filename in os.listdir("."):
              if filename.lower().endswith(".webp"):
                  if os.path.isfile(filename):
                      images.append(filename)

          images.sort(key=str.lower)

          with open("images.json", "w", encoding="utf-8") as file:
              json.dump(images, file, ensure_ascii=False, indent=2)

          print(f"Found {len(images)} WebP images")
          PY

      - name: Commit gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --cached --quiet || (
            git commit -m "Update WebP image gallery" &&
            git push
          )
