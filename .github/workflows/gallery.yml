name: Update Image Gallery

on:
  push:
    branches:
      - main
    paths:
      - '**/*.webp'
      - '**/*.WEBP'
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.JPG'
      - '**/*.jpeg'
      - '**/*.JPEG'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add images from category folders without changing existing entries
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          categories = [
              "کاور ریلز",
              "بنر",
              "کارت ویزیت",
              "کارت ضمانت",
              "فاکتور",
              "لوگو",
              "منو",
              "پوستر",
              "سربرگ",
              "سرتیفیکیت",
              "تراکت"
          ]
          manifest_path = Path("images.json")
          if manifest_path.exists():
              try:
                  gallery = json.loads(manifest_path.read_text(encoding="utf-8"))
                  if not isinstance(gallery, list):
                      raise ValueError("images.json must contain a JSON array")
              except Exception as exc:
                  raise SystemExit(f"Cannot safely read images.json: {exc}")
          else:
              raise SystemExit("images.json is missing; refusing to create a replacement")

          known = {
              str(item.get("src", "")).replace("\\", "/")
              for item in gallery if isinstance(item, dict)
          }
          added = []
          extensions = {".webp", ".png", ".jpg", ".jpeg"}

          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              parts = path.parts
              if len(parts) < 2 or parts[0] not in categories:
                  continue
              src = path.as_posix()
              if src in known:
                  continue
              title = path.stem.replace("_", " ").replace("-", " ").strip()
              gallery.append({
                  "category": parts[0],
                  "src": src,
                  "title": title,
                  "kind": parts[0],
                  "summary": ""
              })
              known.add(src)
              added.append((parts[0], src))

          manifest_path.write_text(
              json.dumps(gallery, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          report = [
              "# گزارش خودکار بارگذاری تصاویر",
              "",
              f"- زمان بررسی: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
              f"- تعداد کل نمونه‌کارها در فهرست: {len(gallery)}",
              f"- تصاویر جدید اضافه‌شده در این اجرا: {len(added)}",
              "",
              "## تصاویر جدید"
          ]
          report.extend([f"- {category}: {src}" for category, src in added] or ["- مورد جدیدی اضافه نشد."])
          Path("upload-report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          print(f"Added {len(added)} images. Existing manifest entries were preserved.")
          PY

      - name: Commit updated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json upload-report.md
          git diff --cached --quiet || (
            git commit -m "Add portfolio images from category folders" &&
            git push
          )
